<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="swanBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="neonFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Cyber Shield Crest -->
  <path d="M200 24 L324 72 V184 C324 268 200 348 200 348 C200 348 76 268 76 184 V72 Z"
        fill="url(#shieldGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Inner Cyan Circuit Rim -->
  <path d="M200 42 L306 84 V180 C306 250 200 324 200 324 C200 324 94 250 94 180 V84 Z"
        fill="none" stroke="url(#cyanGlow)" stroke-width="2" stroke-dasharray="8 6" filter="url(#neonFilter)" opacity="0.85"/>

  <!-- Circuit Trace Nodes -->
  <circle cx="306" cy="130" r="3.5" fill="#38bdf8" filter="url(#neonFilter)"/>
  <circle cx="94" cy="130" r="3.5" fill="#38bdf8" filter="url(#neonFilter)"/>
  <circle cx="200" cy="324" r="4" fill="#38bdf8" filter="url(#neonFilter)"/>

  <!-- Swan Silhouette Group -->
  <g transform="translate(4, -10)">
    <!-- Swan Body & Neck -->
    <path d="M165 92 C142 92 124 108 124 130 C124 144 130 152 138 158 C135 166 128 178 122 195 C114 218 118 244 134 262 C152 282 182 290 206 280 C182 272 170 252 172 230 C174 210 188 190 206 172 C214 164 216 156 214 146 C210 130 198 120 182 120 C172 120 162 126 158 134 C155 140 150 144 144 144 C138 144 135 138 137 132 C141 114 154 92 165 92 Z"
          fill="url(#swanBodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Swan Beak & Head Detail -->
    <path d="M125 136 L134 146 L136 152 L128 152 Z" fill="#0284c7"/>
    <circle cx="140" cy="124" r="2" fill="#38bdf8" filter="url(#neonFilter)"/>

    <!-- Wing Feather 1 (Top / Longest) -->
    <path d="M214 116 C238 130 262 162 268 196 C254 186 238 178 220 172 C236 154 246 138 214 116 Z"
          fill="url(#swanBodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Wing Feather 2 (Middle Upper) -->
    <path d="M208 156 C232 174 252 204 254 228 C242 218 228 210 212 204 C226 188 234 174 208 156 Z"
          fill="url(#swanBodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Wing Feather 3 (Middle Lower) -->
    <path d="M200 192 C222 210 238 236 238 256 C226 248 214 242 198 236 C210 222 218 210 200 192 Z"
          fill="url(#swanBodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Wing Feather 4 (Bottom) -->
    <path d="M190 226 C208 242 220 262 218 276 C208 270 198 266 186 262 C196 250 202 240 190 226 Z"
          fill="url(#swanBodyGrad)" stroke="#475569" stroke-width="1.5"/>

    <!-- Circuit Inlays on Wing Feathers -->
    <path d="M228 148 Q248 174 250 196" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="250" cy="196" r="2" fill="#00f5d4"/>
    <path d="M220 184 Q236 206 238 224" fill="none" stroke="#00f5d4" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="238" cy="224" r="2" fill="#00f5d4"/>
  </g>

  <!-- High-Tech Banner Plaque at Bottom -->
  <polygon points="90,326 310,326 325,358 75,358" fill="#090d16" stroke="#0284c7" stroke-width="2"/>
  
  <!-- Banner Text: BLACKSWAN -->
  <text x="200" y="348" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#f8fafc" letter-spacing="4" text-anchor="middle">
    BLACK<tspan fill="#38bdf8">SWAN</tspan>
  </text>

  <!-- Team Subtitle -->
  <text x="200" y="378" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="10" fill="#94a3b8" letter-spacing="2" text-anchor="middle">
    SIH 2026 • TEAM ID: 133455
  </text>
</svg>
